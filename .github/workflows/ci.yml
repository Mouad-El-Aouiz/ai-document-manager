name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting with Prettier
        run: pnpm format:check

      - name: Typecheck with tsc
        run: pnpm typecheck
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aidm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aidm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: pgsty/silo:latest
        env:
          MINIO_ROOT_USER: aidm_admin
          MINIO_ROOT_PASSWORD: change_me_in_dev
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # IMPORTANT : l'API utilise aidm_app pour subir la RLS
      DATABASE_URL: postgresql://aidm_app:password@localhost:5432/aidm?schema=public
      # Les migrations, le seed et l'admin utilisent postgres
      DATABASE_URL_MIGRATE: postgresql://postgres:postgres@localhost:5432/aidm?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: dev_access_secret_that_is_at_least_32_chars_long
      JWT_REFRESH_SECRET: dev_refresh_secret_that_is_at_least_32_chars_long
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: error
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: aidm_admin
      S3_SECRET_KEY: change_me_in_dev
      S3_BUCKET: aidm-documents
      S3_REGION: us-east-1
      USE_REAL_S3_IN_TESTS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create pgvector extension
        run: psql "postgresql://postgres:postgres@localhost:5432/aidm" -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Setup aidm_app role
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/aidm" -c "CREATE ROLE aidm_app WITH LOGIN PASSWORD 'password';"
          psql "postgresql://postgres:postgres@localhost:5432/aidm" -c "GRANT USAGE ON SCHEMA public TO aidm_app;"
          psql "postgresql://postgres:postgres@localhost:5432/aidm" -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO aidm_app;"

      - name: Apply Prisma migrations
        run: pnpm --filter @aidm/api db:migrate:deploy

      - name: Apply RLS
        run: pnpm --filter @aidm/api db:rls

      - name: Setup Storage Bucket
        run: pnpm --filter @aidm/api storage:setup

      - name: Seed database
        run: pnpm --filter @aidm/api db:seed

      - name: Run tests with Vitest
        run: pnpm --filter @aidm/api test
  docker:
    name: Docker Compose up
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare .env
        run: cp .env.example .env

      - name: Start infra and wait for healthchecks
        run: docker compose up -d --wait

      - name: Show running services
        if: always()
        run: docker compose ps

      - name: Tear down infra
        if: always()
        run: docker compose down -v
